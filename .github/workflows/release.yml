name: Release

# Tags name the app and its version: vais-commander-v0.5.0 releases
# apps/vais-commander. A manual run builds the app it is given, without a release.
on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      app:
        description: App to build (a directory in apps/)
        default: vais-commander

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The repository has one "Latest" release: only this app's releases take it,
  # so /releases/latest/download/... keeps pointing at it.
  LATEST_APP: vais-commander

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: App and version (must match the tag)
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            app="${tag%-v*}"
          else
            tag=""
            app="${{ inputs.app }}"
          fi
          manifest="apps/$app/Cargo.toml"
          [[ -f $manifest ]] || { echo "no app $app (missing $manifest)" >&2; exit 1; }
          crate=$(grep -m1 '^version' "$manifest" | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -n $tag && "$tag" != "$app-v$crate" ]]; then
            echo "tag $tag does not match $manifest version $crate" >&2
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux dependencies (gpui-kit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            libvulkan1 vulkan-validationlayers

      - name: Build
        run: cargo build --release --locked -p ${{ steps.version.outputs.app }} --target ${{ matrix.target }}

      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --release --locked -p ${{ steps.version.outputs.app }} --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: apps/${{ steps.version.outputs.app }}/scripts/package.sh ${{ matrix.target }} ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes (the version's CHANGELOG.md section)
        id: notes
        run: |
          app="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          # The title: the app's name from the first heading of its README.
          title=$(grep -m1 '^# ' "apps/$app/README.md" | sed 's/^# //')
          echo "name=${title:-$app} $version" >> "$GITHUB_OUTPUT"
          changelog="apps/$app/CHANGELOG.md"
          awk -v h="## $version - " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' \
            "$changelog" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "$changelog has no section for $version" >&2
            exit 1
          fi
          cat release-notes.md
          # A version with a suffix (0.5.0-beta.1) is a pre-release.
          [[ $version == *-* ]] && pre=true || pre=false
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          [[ $app == "$LATEST_APP" && $pre == false ]] && latest=true || latest=false
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.name }}
          files: dist/*
          # Only the CHANGELOG.md section: GitHub's generated notes run from the
          # previous tag of any app, so they would mix the apps' commits.
          body_path: release-notes.md
          prerelease: ${{ steps.notes.outputs.prerelease }}
          make_latest: ${{ steps.notes.outputs.latest }}
