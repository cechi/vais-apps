[package]
name = "vais-commander"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Keyboard-driven file manager with a configurable grid of panels"
license = "MIT"
build = "build.rs"

[[bin]]
name = "vais-commander"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
trash = "5"
open = "5"
regex = "1"
# Thumbnails: decode and scale images, rasterise SVG. All three already
# come with gpui, so the build only gains the direct use.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi"] }
resvg = "0.46"
usvg = "0.46"
ssh2 = "0.9"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
# File icons from the shell (see src/icons/windows.rs); both crates are
# already in the dependency graph through gpui.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
