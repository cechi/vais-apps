[package]
name = "vais-commander"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Keyboard-driven file manager with a configurable grid of panels"
license = "MIT"
build = "build.rs"

[[bin]]
name = "vais-commander"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.8.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
trash = "5"
open = "5"
regex = "1"

[target.'cfg(windows)'.dependencies]
# File icons from the shell (see src/icons/windows.rs); both crates are
# already in the dependency graph through gpui.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
