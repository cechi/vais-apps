[package]
name = "vais-commander"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
description = "Keyboard-driven file manager with a configurable grid of panels"
license = "MIT"
build = "build.rs"

[[bin]]
name = "vais-commander"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
trash = "5"
open = "5"
regex = "1"
# Thumbnails: decode and scale images, rasterise SVG. All three already
# come with gpui, so the build only gains the direct use.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi"] }
resvg = "0.46"
usvg = "0.46"
ssh2 = "0.9"
# Secret Service over zbus (pure Rust): no libdbus to link against on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
suppaftp = { version = "12", default-features = false }
# Directory watching (auto refresh); futures only for its channel and select.
notify = "8"
futures = "0.3"
zip = { version = "9", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma", "chrono"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
zstd = "0.14"
liblzma = { version = "0.4", features = ["static"] }
# 7z archives (pure Rust); encrypted ones are reported, not opened.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "deflate", "ppmd", "zstd"] }
alacritty_terminal = { version = "0.26", default-features = false }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# statvfs for the free-space figure in the panel footer.
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# No system libssh2 / OpenSSL to link against on macOS and Windows runners.
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(windows)'.dependencies]
# File icons from the shell (see src/icons/windows.rs); both crates are
# already in the dependency graph through gpui.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
